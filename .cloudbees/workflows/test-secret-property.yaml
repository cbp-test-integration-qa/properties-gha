apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: verify-secret-property

on:
  workflow_dispatch:

jobs:
  test-secret-property:
    steps:

      # Step 1: Create secret property
      - name: Create secret property
        uses: cloudbees-io/create-property@v1
        with:
          property-name: my.secret.token
          property-type: secret
          property-value: "mySuperSecret123"

      # Step 2: Retrieve property
      - name: Get property
        id: getProp
        uses: cloudbees-io/get-property@v1
        with:
          property-name: my.secret.token

      # Step 3: Verify value
      - name: Validate property value
        run: |
          if [ "${{ steps.getProp.outputs.value }}" != "mySuperSecret123" ]; then
            echo "❌ Property value mismatch"
            exit 1
          else
            echo "✅ Property value matches"
          fi